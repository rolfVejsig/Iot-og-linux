<!DOCTYPE html>
<html>

<head>
    <title>Sensor Settings</title>
</head>

<body>

<h1>Sensor Settings</h1>

<h2>Client</h2>

<select id="client">
    <option value="">Select client</option>
</select>


<h2>Working Hours</h2>

<label>
    Start:
    <input type="time" id="working_start" value="08:00">
</label>

<br><br>

<label>
    End:
    <input type="time" id="working_end" value="18:00">
</label>


<h2>Database</h2>

<label>
    Database interval (minutes):
    <input type="number" id="database_interval" value="10">
</label>


<h2>Temperature</h2>

<label>
    Low:
    <input type="number" id="temperature_low" value="18">
</label>

<br><br>

<label>
    High:
    <input type="number" id="temperature_high" value="21">
</label>


<h2>Humidity</h2>

<label>
    Low:
    <input type="number" id="humidity_low" value="30">
</label>

<br><br>

<label>
    High:
    <input type="number" id="humidity_high" value="50">
</label>


<br><br>

<button id="saveButton">Save</button>


<script>

// Get all clients

async function getClients() {

    try {

        const response = await fetch("/clients/get_clients");

        const clients = await response.json();

        const select = document.getElementById("client");

        clients.forEach(client => {

            const option = document.createElement("option");

            option.value = client.client_id;

            option.textContent = client.client_name;

            select.appendChild(option);

        });

    } catch (error) {

        console.error(error);

    }

}


// Get settings for selected client

document.getElementById("client").addEventListener("change", async function() {

    const selectedClientID = this.value;

    if (!selectedClientID) {
        return;
    }

    try {

        const response = await fetch(
            "/clients/settings/" + selectedClientID
        );

        const result = await response.json();

        if (result.length > 0) {

            const settings = result[0];

            document.getElementById("database_interval").value =
                settings.database_interval;

            document.getElementById("temperature_low").value =
                settings.temperature_low;

            document.getElementById("temperature_high").value =
                settings.temperature_high;

            document.getElementById("humidity_low").value =
                settings.humidity_low;

            document.getElementById("humidity_high").value =
                settings.humidity_high;

            // Working hours

            document.getElementById("working_start").value =
                settings.working_start || "08:00";

            document.getElementById("working_end").value =
                settings.working_end || "18:00";

        } else {

            // Default working hours

            document.getElementById("working_start").value = "08:00";
            document.getElementById("working_end").value = "18:00";

        }

    } catch (error) {

        console.error(error);

    }

});


// Save settings

document.getElementById("saveButton").addEventListener("click", async function() {

    const client_id =
        Number(document.getElementById("client").value);

    if (!client_id) {

        alert("Select a client");

        return;

    }

    const data = {

        client_id: client_id,

        working_start:
            document.getElementById("working_start").value,

        working_end:
            document.getElementById("working_end").value,

        database_interval:
            Number(document.getElementById("database_interval").value),

        temperature_low:
            Number(document.getElementById("temperature_low").value),

        temperature_high:
            Number(document.getElementById("temperature_high").value),

        humidity_low:
            Number(document.getElementById("humidity_low").value),

        humidity_high:
            Number(document.getElementById("humidity_high").value)

    };


    try {

        const response = await fetch("/clients/insert_settings", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify(data)

        });


        const result = await response.json();


        if (response.status === 201) {

            alert("Settings saved");

        } else {

            alert("Error: " + result.error);

        }

    } catch (error) {

        console.error(error);

        alert("Could not connect to API");

    }

});

getClients();

</script>

</body>

</html>
